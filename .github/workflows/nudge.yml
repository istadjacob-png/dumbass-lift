name: Daily don't-skip nudge

# Sends the user a push notification if they haven't trained on a training day.
# Runs hourly; nudge.mjs sends only when it's the user's local 3 PM (push.hour in
# push.tz), so it stays correct across DST and any timezone. Free on public repos.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the 3 PM time gate and send now (test)'
        type: boolean
        default: false

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Send nudge
        working-directory: scripts
        env:
          NUDGE_EMAIL: ${{ secrets.NUDGE_EMAIL }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          FORCE: ${{ inputs.force }}
        run: node nudge.mjs
